<style>
:root{--ink:#1b2a2f;--paper:#f6f5f0;--accent:#e3a008;--muted:#566468}

body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
